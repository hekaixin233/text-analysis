[project]
name = "text-analysis"
version = "0.1.0"
description = "Reusable Chinese text frequency and sentence-length analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jieba>=0.42.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
text-analysis = "text_analysis.cli:main"
import-liu-cixin = "text_analysis.importer:main"
text-compare = "text_analysis.comparison:main"
text-authorship = "text_analysis.authorship:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
